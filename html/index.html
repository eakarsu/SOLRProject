            $(function () {

                    /*source: "/autosuggest?storeid="+document.getElementById('storeid').value+

                    source: function( request, response ) {
                            $.ajax({
                                    url: "/autosuggest",
                                    dataType: "jsonp",
                                    data: {
                                            q: request.term,
                                            storeid:document.getElementById('storeid').value,
                                            customerid:document.getElementById('customerid').value,
                                            custsegmentid:document.getElementById('custsegmentid').value,

                                    success: function( data ) {
                                            response( data );
                                    },
                                    dataType: "json"
                            });
                     },

                    select: function (event, ui) {
                        $("#q").val(ui.item.value);

                    },

                    open: function (event, ui) {
                        $(".ui-autocomplete").css("z-index", 1000);
                    }
                });
            });
        </script>

        <script>
            $(document).ready(function () {
                $("#arabutton").click(function () {
                    
                    if ($("#q").val() == '') {
                        return false;
                    }
                    $("#startindex").val(0);
                    $("#endindex").val(10);
                    $("#query-form").append('<input type="hidden" name="start" value="0" />');
                    $("#query-form").submit();
                });

                $("#q").keypress(function (e) {
                    if (e.keyCode === 13) {
                        if ($("#q").val() == '') {
                            return false;
                        }

                        $("#startindex").val(0);
                        $("#endindex").val(10);
                        $("#query-form").append('<input type="hidden" name="start" value="0" />');
                        $("#query-form").submit();
                    }
                });

            });

        </script>
